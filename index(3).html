<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tamaya Watch</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');
  html,body{margin:0;padding:0;background:#fdeef4;}
  #root{min-height:100vh;}
  .tw-root{
    --bg:#fdeef4; --panel:#ffffff; --panel-2:#fdf2f7; --border:#f3cede; --border-soft:#f1dbe7;
    --red:#d6336c; --red-dim:#f7b8d0; --text:#3d1728; --muted:#a9748c;
    font-family:'IBM Plex Sans',sans-serif; color:var(--text); background:var(--bg);
    min-height:100vh; position:relative;
  }
  .tw-root::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(900px 500px at 12% -10%, rgba(214,51,108,0.14), transparent 60%),
      radial-gradient(700px 420px at 100% 10%, rgba(255,182,213,0.35), transparent 55%);
  }
  .tw-root *{box-sizing:border-box;}
  h1,h2,h3,.tw-display{font-family:'Space Grotesk',sans-serif;}
  .tw-mono{font-family:'JetBrains Mono',monospace;}
  .tw-loading{color:var(--red); font-family:'JetBrains Mono',monospace; letter-spacing:2px;}
  .tw-btn{
    background:var(--red); color:#fff; border:none; padding:10px 18px; border-radius:6px;
    font-weight:600; cursor:pointer; font-size:14px; transition:transform .12s ease, box-shadow .12s ease;
    box-shadow:0 0 0 rgba(214,51,108,0);
  }
  .tw-btn:hover{ box-shadow:0 0 24px rgba(214,51,108,0.35); transform:translateY(-1px); }
  .tw-btn:disabled{ opacity:.4; cursor:not-allowed; box-shadow:none; transform:none; }
  .tw-btn-outline{
    background:transparent; color:var(--text); border:1px solid var(--border-soft); padding:10px 18px;
    border-radius:6px; font-weight:500; cursor:pointer; font-size:14px; transition:border-color .12s ease;
  }
  .tw-btn-outline:hover{ border-color:var(--red); }
  .tw-input, .tw-textarea, .tw-select{
    background:var(--panel-2); border:1px solid var(--border-soft); color:var(--text); border-radius:6px;
    padding:10px 12px; font-size:14px; width:100%; font-family:inherit;
  }
  .tw-input:focus, .tw-textarea:focus, .tw-select:focus{ outline:none; border-color:var(--red); }
  .tw-card{
    background:var(--panel); border:1px solid var(--border-soft); border-radius:10px; padding:20px;
  }
  .tw-pill{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12.5px; font-weight:500; }
  .tw-label-muted{ color:var(--muted); font-size:12.5px; }
  .tw-shell{ display:flex; min-height:100vh; position:relative; z-index:1; }
  .tw-main{ flex:1; min-width:0; }
  .tw-content{ padding:28px 24px 60px; }
  @media (max-width:880px){ .tw-content{ padding:20px 16px 50px; } }

  .tw-sidebar{ width:230px; background:#3a1029; border-right:1px solid #55193f; padding:20px 14px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh; overflow-y:auto; z-index:31; }
  .tw-navitem{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:7px; color:#dba4bf; font-size:14px; cursor:pointer; transition:background .12s, color .12s; }
  .tw-navitem:hover{ background:#4a1636; color:#fff0f6; }
  .tw-navitem-active{ background:linear-gradient(90deg, rgba(255,111,168,0.28), rgba(255,111,168,0.03)); color:#fff0f6; border-left:2px solid #ff6fa8; padding-left:10px; }
  .tw-only-mobile{ display:none; }
  @media (max-width: 880px){
    .tw-sidebar{ position:fixed; left:-250px; top:0; transition:left .18s ease; box-shadow:0 0 40px rgba(0,0,0,.6); }
    .tw-sidebar-open{ left:0; }
    .tw-only-mobile{ display:block; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  "use strict";

  /* ============================================================
     TAMAYA WATCH — plateforme de signalement communautaire
     Version JavaScript pur (aucune dépendance externe : pas de
     React/Babel/CDN). Les données sont stockées via localStorage.
     Toute la logique de permission passe par un unique module
     `backend` : l'UI ne modifie jamais les données directement,
     elle appelle toujours backend.xxx(session, ...) qui revérifie
     le rôle avant d'agir.
     ============================================================ */

  var ROLES = ["Owner", "Watch", "Proofs", "Staff", "Member"];

  var ROLE_META = {
    Owner: { emoji: "👑", color: "#d6336c", desc: "Accès complet, gère rôles, utilisateurs et paramètres." },
    Watch: { emoji: "🔎", color: "#3aa0ff", desc: "Examine les signalements, passe le statut en vérification." },
    Proofs: { emoji: "📁", color: "#f5c542", desc: "Consulte et organise les preuves associées." },
    Staff: { emoji: "🛡️", color: "#34d399", desc: "Traite les signalements qui lui sont transmis." },
    Member: { emoji: "👤", color: "#a9748c", desc: "Crée des signalements et suit les siens." },
  };

  var STATUS = {
    pending: { emoji: "🟡", label: "En attente", color: "#f5c542" },
    verifying: { emoji: "🔵", label: "En vérification", color: "#3aa0ff" },
    verified: { emoji: "🟢", label: "Vérifié", color: "#34d399" },
    rejected: { emoji: "🔴", label: "Rejeté", color: "#ff3b4e" },
    archived: { emoji: "⚫", label: "Archivé", color: "#8a6577" },
  };

  var REASONS = ["Arnaque / scam", "Harcèlement", "Contenu interdit", "Usurpation d'identité", "Ban evasion", "Autre"];

  var TITLES = {
    home: "Accueil", how: "Fonctionnement", "new-report": "Faire un signalement", "my-reports": "Mes signalements",
    dashboard: "Dashboard Owner", reports: "Signalements", evidence: "Preuves", members: "Membres",
    roles: "Gestion des rôles", logs: "Journal des actions", settings: "Paramètres",
  };

  var K_OWNER = "tw:owner";
  var K_USERS = "tw:users";
  var K_REPORTS = "tw:reports";
  var K_LOGS = "tw:logs";
  var K_SESSION = "tw:session";

  function uid(prefix) {
    return (prefix + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)).toUpperCase();
  }
  function fmtDate(ts) {
    return new Date(ts).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function storeGet(key) {
    try {
      var raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function storeSet(key, value) {
    try {
      window.localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) { console.error("storage set failed", e); return false; }
  }

  /* ---------------- application state ---------------- */
  var APP = {
    loaded: false,
    owner: null,
    users: [],
    reports: [],
    logs: [],
    session: null,
    page: "home",
    navOpen: false,
    reportsFilter: "all",
    confirmingReset: false,
    newReportDone: null,
    roleMsg: "",
  };

  /* ---------------- backend (permission checks) ---------------- */
  function roleOf(pseudo) {
    if (!pseudo) return null;
    if (APP.owner && pseudo.toLowerCase() === APP.owner.toLowerCase()) return "Owner";
    var u = APP.users.find(function (u) { return u.pseudo.toLowerCase() === pseudo.toLowerCase(); });
    return u ? u.role : "Member";
  }
  function canViewReport(user, report) {
    var role = roleOf(user);
    if (role === "Owner" || role === "Watch" || role === "Proofs") return true;
    if (role === "Staff") return true;
    if (role === "Member") return report.author.toLowerCase() === user.toLowerCase();
    return false;
  }
  function visibleReports(user) { return APP.reports.filter(function (r) { return canViewReport(user, r); }); }

  function logAction(actor, action, details) {
    var entry = { date: Date.now(), actor: actor, action: action, details: details };
    APP.logs = [entry].concat(APP.logs).slice(0, 500);
    storeSet(K_LOGS, APP.logs);
  }

  function createReport(user, data) {
    var role = roleOf(user);
    if (!role) return { ok: false, error: "Utilisateur inconnu." };
    var report = {
      id: uid("SIG"), date: Date.now(), author: user, reportedUser: data.reportedUser, reason: data.reason,
      description: data.description, status: "pending", assignedStaff: null, evidence: [], notes: [],
      history: [{ date: Date.now(), by: user, text: "Signalement créé." }],
    };
    APP.reports = [report].concat(APP.reports);
    storeSet(K_REPORTS, APP.reports);
    logAction(user, "Création signalement", report.id + " — " + data.reportedUser);
    return { ok: true, report: report };
  }

  function addNote(user, reportId, text) {
    var role = roleOf(user);
    var report = APP.reports.find(function (r) { return r.id === reportId; });
    if (!report) return { ok: false, error: "Introuvable." };
    var allowed = ["Owner", "Watch", "Proofs", "Staff"].indexOf(role) !== -1 || report.author.toLowerCase() === user.toLowerCase();
    if (!allowed || !canViewReport(user, report)) return { ok: false, error: "Permission refusée." };
    APP.reports = APP.reports.map(function (r) {
      return r.id === reportId ? Object.assign({}, r, { notes: r.notes.concat([{ text: text, by: user, role: role, date: Date.now() }]) }) : r;
    });
    storeSet(K_REPORTS, APP.reports);
    logAction(user, "Ajout note", reportId);
    return { ok: true };
  }

  function addEvidence(user, reportId, text) {
    var role = roleOf(user);
    if (["Owner", "Proofs"].indexOf(role) === -1) return { ok: false, error: "Seuls Owner et Proofs peuvent ajouter des preuves." };
    APP.reports = APP.reports.map(function (r) {
      return r.id === reportId ? Object.assign({}, r, { evidence: r.evidence.concat([{ text: text, by: user, date: Date.now() }]) }) : r;
    });
    storeSet(K_REPORTS, APP.reports);
    logAction(user, "Ajout preuve", reportId);
    return { ok: true };
  }

  function setStatus(user, reportId, newStatus) {
    var role = roleOf(user);
    var report = APP.reports.find(function (r) { return r.id === reportId; });
    if (!report) return { ok: false, error: "Introuvable." };
    var isFinal = ["verified", "rejected", "archived"].indexOf(newStatus) !== -1;
    if (isFinal && role !== "Owner") return { ok: false, error: "Seul le Owner peut finaliser un statut." };
    if (newStatus === "verifying" && ["Owner", "Watch"].indexOf(role) === -1) return { ok: false, error: "Seuls Owner et Watch peuvent passer en vérification." };
    APP.reports = APP.reports.map(function (r) {
      return r.id === reportId ? Object.assign({}, r, { status: newStatus, history: r.history.concat([{ date: Date.now(), by: user, text: "Statut → " + STATUS[newStatus].label }]) }) : r;
    });
    storeSet(K_REPORTS, APP.reports);
    logAction(user, "Changement statut", reportId + " → " + STATUS[newStatus].label);
    return { ok: true };
  }

  function assignStaff(user, reportId, staffPseudo) {
    var role = roleOf(user);
    if (role !== "Owner") return { ok: false, error: "Seul le Owner assigne un signalement." };
    APP.reports = APP.reports.map(function (r) {
      return r.id === reportId ? Object.assign({}, r, { assignedStaff: staffPseudo, history: r.history.concat([{ date: Date.now(), by: user, text: "Transmis à " + staffPseudo }]) }) : r;
    });
    storeSet(K_REPORTS, APP.reports);
    logAction(user, "Transmission", reportId + " → " + staffPseudo);
    return { ok: true };
  }

  function setRole(user, targetPseudo, newRole) {
    var role = roleOf(user);
    if (role !== "Owner") return { ok: false, error: "Seul le Owner gère les rôles." };
    if (APP.owner && targetPseudo.toLowerCase() === APP.owner.toLowerCase()) return { ok: false, error: "Le Owner ne peut pas être modifié." };
    if (newRole === "Owner") return { ok: false, error: "Il ne peut y avoir qu'un seul Owner." };
    var users = APP.users;
    var exists = users.find(function (u) { return u.pseudo.toLowerCase() === targetPseudo.toLowerCase(); });
    if (exists) {
      users = users.map(function (u) { return u.pseudo.toLowerCase() === targetPseudo.toLowerCase() ? Object.assign({}, u, { role: newRole }) : u; });
    } else {
      users = users.concat([{ pseudo: targetPseudo, role: newRole, addedAt: Date.now(), addedBy: user }]);
    }
    APP.users = users;
    storeSet(K_USERS, users);
    logAction(user, "Rôle attribué", targetPseudo + " → " + newRole);
    return { ok: true };
  }

  function claimOwner(pseudo) {
    if (APP.owner) return { ok: false, error: "Un Owner existe déjà." };
    APP.owner = pseudo;
    storeSet(K_OWNER, pseudo);
    logAction(pseudo, "Configuration initiale", "Owner défini");
    return { ok: true };
  }

  var backend = {
    roleOf: roleOf, canViewReport: canViewReport, visibleReports: visibleReports, createReport: createReport,
    addNote: addNote, addEvidence: addEvidence, setStatus: setStatus, assignStaff: assignStaff,
    setRole: setRole, claimOwner: claimOwner,
  };

  /* ---------------- navigation / session actions ---------------- */
  function getNav(role, session) {
    var items = [
      { key: "home", label: "Accueil", show: true },
      { key: "how", label: "Fonctionnement", show: true },
      { key: "new-report", label: "Faire un signalement", show: !!session },
      { key: "my-reports", label: "Mes signalements", show: !!session },
      { key: "dashboard", label: "Dashboard", show: role === "Owner" },
      { key: "reports", label: "Signalements", show: ["Owner", "Watch", "Proofs", "Staff"].indexOf(role) !== -1 },
      { key: "evidence", label: "Preuves", show: ["Owner", "Proofs"].indexOf(role) !== -1 },
      { key: "members", label: "Membres", show: role === "Owner" },
      { key: "roles", label: "Gestion des rôles", show: role === "Owner" },
      { key: "logs", label: "Logs", show: role === "Owner" },
      { key: "settings", label: "Paramètres", show: role === "Owner" },
    ];
    return items.filter(function (n) { return n.show; });
  }

  function setPage(p) { APP.page = p; APP.navOpen = false; APP.newReportDone = null; render(); }
  function login(pseudoRaw) {
    var clean = (pseudoRaw || "").trim();
    if (!clean) return;
    storeSet(K_SESSION, { pseudo: clean });
    APP.session = clean;
    APP.page = "home";
    render();
  }
  function logout() { storeSet(K_SESSION, null); APP.session = null; render(); }
  function claimOwnerAndLogin(pseudoRaw) {
    var clean = (pseudoRaw || "").trim();
    if (!clean) return;
    var res = backend.claimOwner(clean);
    if (res.ok) login(clean); else render();
  }

  /* ---------------- templates ---------------- */
  function reportCardHtml(r, innerHtml) {
    var s = STATUS[r.status];
    return '<div class="tw-card">' +
      '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px">' +
      '<div class="tw-mono" style="color:#a9748c;font-size:13px">' + esc(r.id) + " · " + esc(fmtDate(r.date)) + "</div>" +
      '<span class="tw-pill" style="background:' + s.color + '1a;color:' + s.color + ";border:1px solid " + s.color + '55">' + s.emoji + " " + esc(s.label) + "</span>" +
      "</div>" +
      '<div style="font-weight:600;margin-bottom:4px">Signalé : ' + esc(r.reportedUser) + "</div>" +
      '<div class="tw-label-muted" style="margin-bottom:8px">Motif : ' + esc(r.reason) + " · Par " + esc(r.author) + "</div>" +
      '<div style="font-size:14.5px;line-height:1.6;margin-bottom:12px">' + esc(r.description) + "</div>" +
      innerHtml +
      "</div>";
  }

  function pageHome() {
    var statusCards = Object.keys(STATUS).map(function (k) {
      var v = STATUS[k];
      return '<div class="tw-card" style="padding:14px"><div class="tw-pill" style="background:' + v.color + '1a;color:' + v.color + ";border:1px solid " + v.color + '55">' + v.emoji + " " + esc(v.label) + "</div></div>";
    }).join("");
    return '<div style="max-width:760px">' +
      '<div style="color:#d6336c;font-family:\'JetBrains Mono\',monospace;font-size:13px;margin-bottom:10px">SURVEILLANCE COMMUNAUTAIRE</div>' +
      '<h1 style="font-size:34px;line-height:1.15;margin:0 0 16px">Signaler un problème, garder une trace, décider avec des preuves.</h1>' +
      '<p style="color:#a9748c;font-size:15.5px;line-height:1.7;margin-bottom:24px">' +
      "Tamaya Watch centralise les signalements de la communauté Discord : chaque membre peut déclarer un " +
      "problème, l'équipe autorisée l'examine, ajoute des preuves et fait évoluer son statut jusqu'à décision. " +
      "Aucun chiffre affiché ici n'est fictif — les compteurs reflètent uniquement les signalements réellement " +
      "enregistrés dans cette instance." +
      "</p>" +
      '<div style="display:flex;gap:12px;flex-wrap:wrap">' +
      '<button class="tw-btn" data-action="goto" data-id="new-report">Faire un signalement</button>' +
      '<button class="tw-btn-outline" data-action="goto" data-id="how">Comment ça marche</button>' +
      "</div>" +
      '<div style="margin-top:36px;display:grid;grid-template-columns:repeat(auto-fit, minmax(200px,1fr));gap:14px">' + statusCards + "</div>" +
      "</div>";
  }

  function pageHow() {
    var roleCards = ROLES.map(function (r) {
      var m = ROLE_META[r];
      return '<div class="tw-card" style="display:flex;gap:14px;align-items:flex-start"><div style="font-size:22px">' + m.emoji + '</div><div><div style="font-weight:600">' + esc(r) + '</div><div class="tw-label-muted">' + esc(m.desc) + "</div></div></div>";
    }).join("");
    return '<div style="max-width:760px">' +
      '<p style="color:#a9748c;line-height:1.7;margin-bottom:24px">' +
      "Le fonctionnement repose sur cinq rôles distincts. Chacun ne voit et ne modifie que ce que sa fonction exige — " +
      "ces règles sont vérifiées à chaque action, pas seulement cachées dans l'interface." +
      "</p>" +
      '<div style="display:grid;gap:12px">' + roleCards + "</div>" +
      '<div class="tw-card" style="margin-top:20px">' +
      '<div style="font-weight:600;margin-bottom:8px">Cycle de vie d\'un signalement</div>' +
      '<div class="tw-label-muted" style="line-height:1.8">🟡 En attente → 🔵 En vérification (Watch) → 🟢 Vérifié / 🔴 Rejeté / ⚫ Archivé (décision finale, réservée au Owner).</div>' +
      "</div></div>";
  }

  function pageNewReport() {
    if (APP.newReportDone) {
      return '<div class="tw-card" style="max-width:520px">' +
        '<div style="color:#34d399;font-weight:600;margin-bottom:8px">Signalement enregistré</div>' +
        '<div class="tw-mono" style="color:#a9748c;margin-bottom:16px">' + esc(APP.newReportDone.id) + "</div>" +
        '<button class="tw-btn" data-action="goto" data-id="my-reports">Voir mes signalements</button>' +
        "</div>";
    }
    var reasonOptions = REASONS.map(function (r) { return '<option value="' + esc(r) + '">' + esc(r) + "</option>"; }).join("");
    return '<div class="tw-card" style="max-width:520px">' +
      '<label class="tw-label-muted">Utilisateur signalé (pseudo Discord)</label>' +
      '<input id="nr-user" class="tw-input" style="margin:6px 0 16px" placeholder="ex : pseudo#0000">' +
      '<label class="tw-label-muted">Motif</label>' +
      '<select id="nr-reason" class="tw-select" style="margin:6px 0 16px">' + reasonOptions + "</select>" +
      '<label class="tw-label-muted">Description détaillée</label>' +
      '<textarea id="nr-desc" class="tw-textarea" style="margin:6px 0 16px;min-height:120px" placeholder="Que s\'est-il passé ? Contexte, dates, liens éventuels…"></textarea>' +
      '<div id="nr-err" style="color:#ff3b4e;font-size:13px;margin-bottom:12px"></div>' +
      '<button class="tw-btn" data-action="new-report-submit">Envoyer le signalement</button>' +
      '<div class="tw-label-muted" style="margin-top:10px">Vous pourrez ajouter des preuves ou informations complémentaires depuis « Mes signalements ».</div>' +
      "</div>";
  }

  function pageMyReports() {
    var mine = APP.reports.filter(function (r) { return r.author.toLowerCase() === APP.session.toLowerCase(); });
    if (!mine.length) return '<div class="tw-label-muted">Vous n\'avez encore fait aucun signalement.</div>';
    var cards = mine.map(function (r) {
      var notesHtml = r.notes.length ? '<div style="margin-bottom:10px;display:grid;gap:6px">' + r.notes.map(function (n) {
        return '<div class="tw-label-muted" style="font-size:13px">💬 <b style="color:#3d1728">' + esc(n.by) + "</b> (" + esc(n.role) + ") — " + esc(n.text) + "</div>";
      }).join("") + "</div>" : "";
      var inner = notesHtml + '<div style="display:flex;gap:8px">' +
        '<input id="note-my-' + r.id + '" class="tw-input" placeholder="Ajouter une information">' +
        '<button class="tw-btn-outline" data-action="my-report-note" data-id="' + r.id + '">Ajouter</button>' +
        "</div>";
      return reportCardHtml(r, inner);
    }).join("");
    return '<div style="display:grid;gap:14px;max-width:640px">' + cards + "</div>";
  }

  function pageReportsPanel() {
    var role = roleOf(APP.session);
    var reports = visibleReports(APP.session);
    var filter = APP.reportsFilter || "all";
    var filtered = filter === "all" ? reports : reports.filter(function (r) { return r.status === filter; });
    var staffList = APP.users.filter(function (u) { return u.role === "Staff"; });

    var filterButtons = '<button class="tw-btn-outline" style="' + (filter === "all" ? "border-color:#d6336c" : "") + '" data-action="filter" data-id="all">Tous</button>' +
      Object.keys(STATUS).map(function (k) {
        var v = STATUS[k];
        return '<button class="tw-btn-outline" style="' + (filter === k ? "border-color:" + v.color + ";color:" + v.color : "") + '" data-action="filter" data-id="' + k + '">' + v.emoji + " " + esc(v.label) + "</button>";
      }).join("");

    var list = filtered.map(function (r) {
      var inner = "";
      if (r.assignedStaff) inner += '<div class="tw-label-muted" style="margin-bottom:8px">Transmis à : ' + esc(r.assignedStaff) + "</div>";
      if (r.evidence.length) {
        inner += '<div style="margin-bottom:10px;display:grid;gap:4px"><div class="tw-label-muted" style="font-weight:600">Preuves</div>' +
          r.evidence.map(function (e) { return '<div style="font-size:13.5px">📁 ' + esc(e.text) + ' <span class="tw-label-muted">— ' + esc(e.by) + "</span></div>"; }).join("") + "</div>";
      }
      if (r.notes.length) {
        inner += '<div style="margin-bottom:10px;display:grid;gap:4px">' +
          r.notes.map(function (n) { return '<div class="tw-label-muted" style="font-size:13px">💬 <b style="color:#3d1728">' + esc(n.by) + "</b> (" + esc(n.role) + ") — " + esc(n.text) + "</div>"; }).join("") + "</div>";
      }
      inner += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">';
      if ((role === "Owner" || role === "Watch") && r.status === "pending") {
        inner += '<button class="tw-btn-outline" data-action="report-status" data-id="' + r.id + '" data-status="verifying">Passer en vérification</button>';
      }
      if (role === "Owner") {
        inner += '<button class="tw-btn-outline" style="color:#34d399;border-color:#34d39955" data-action="report-status" data-id="' + r.id + '" data-status="verified">Vérifié</button>';
        inner += '<button class="tw-btn-outline" style="color:#ff3b4e;border-color:#ff3b4e55" data-action="report-status" data-id="' + r.id + '" data-status="rejected">Rejeter</button>';
        inner += '<button class="tw-btn-outline" data-action="report-status" data-id="' + r.id + '" data-status="archived">Archiver</button>';
      }
      inner += "</div>";
      if (role === "Owner" && staffList.length > 0) {
        inner += '<div style="display:flex;gap:8px;margin-bottom:8px"><select id="assign-' + r.id + '" class="tw-select"><option value="">Transmettre à…</option>' +
          staffList.map(function (s) { return '<option value="' + esc(s.pseudo) + '">' + esc(s.pseudo) + "</option>"; }).join("") +
          '</select><button class="tw-btn-outline" data-action="report-assign" data-id="' + r.id + '">Transmettre</button></div>';
      }
      if (role === "Owner" || role === "Proofs") {
        inner += '<div style="display:flex;gap:8px;margin-bottom:8px"><input id="ev-' + r.id + '" class="tw-input" placeholder="Ajouter une preuve (lien, référence…)"><button class="tw-btn-outline" data-action="report-evidence" data-id="' + r.id + '">Ajouter</button></div>';
      }
      inner += '<div style="display:flex;gap:8px"><input id="note-rp-' + r.id + '" class="tw-input" placeholder="Ajouter une note"><button class="tw-btn-outline" data-action="report-note" data-id="' + r.id + '">Note</button></div>';
      return reportCardHtml(r, inner);
    }).join("");

    return "<div>" +
      '<div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap">' + filterButtons + "</div>" +
      (!filtered.length ? '<div class="tw-label-muted">Aucun signalement dans cette catégorie.</div>' : "") +
      '<div style="display:grid;gap:14px;max-width:700px">' + list + "</div>" +
      "</div>";
  }

  function pageEvidence() {
    var items = [];
    APP.reports.forEach(function (r) { r.evidence.forEach(function (e) { items.push(Object.assign({}, e, { reportId: r.id, reportedUser: r.reportedUser })); }); });
    items.sort(function (a, b) { return b.date - a.date; });
    if (!items.length) return '<div class="tw-label-muted">Aucune preuve enregistrée pour le moment.</div>';
    var cards = items.map(function (e) {
      return '<div class="tw-card" style="padding:14px"><div class="tw-mono" style="color:#a9748c;font-size:12.5px;margin-bottom:4px">' + esc(e.reportId) + " · " + esc(fmtDate(e.date)) + '</div><div style="font-size:14.5px">📁 ' + esc(e.text) + '</div><div class="tw-label-muted" style="margin-top:4px">Concerne : ' + esc(e.reportedUser) + " · ajouté par " + esc(e.by) + "</div></div>";
    }).join("");
    return '<div style="display:grid;gap:10px;max-width:640px">' + cards + "</div>";
  }

  function pageDashboard() {
    var counts = { pending: 0, verifying: 0, verified: 0, rejected: 0, archived: 0 };
    APP.reports.forEach(function (r) { counts[r.status]++; });
    var cards = [
      { label: "Total signalements", value: APP.reports.length, color: "#d6336c" },
      { label: "En attente", value: counts.pending, color: STATUS.pending.color },
      { label: "En vérification", value: counts.verifying, color: STATUS.verifying.color },
      { label: "Vérifiés", value: counts.verified, color: STATUS.verified.color },
      { label: "Rejetés", value: counts.rejected, color: STATUS.rejected.color },
      { label: "Archivés", value: counts.archived, color: STATUS.archived.color },
      { label: "Membres suivis", value: APP.users.length, color: "#a9748c" },
    ];
    var cardsHtml = cards.map(function (c) {
      return '<div class="tw-card"><div class="tw-mono" style="font-size:28px;font-weight:700;color:' + c.color + '">' + c.value + '</div><div class="tw-label-muted">' + esc(c.label) + "</div></div>";
    }).join("");
    return "<div>" +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px">' + cardsHtml + "</div>" +
      '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
      '<button class="tw-btn-outline" data-action="goto" data-id="roles">Gestion des rôles</button>' +
      '<button class="tw-btn-outline" data-action="goto" data-id="members">Membres</button>' +
      '<button class="tw-btn-outline" data-action="goto" data-id="logs">Journal des actions</button>' +
      '<button class="tw-btn-outline" data-action="goto" data-id="reports">Voir les signalements</button>' +
      "</div></div>";
  }

  function pageMembers() {
    var all = APP.users.slice();
    if (APP.owner) all.unshift({ pseudo: APP.owner, role: "Owner" });
    var membersHtml;
    if (!all.length) {
      membersHtml = '<div class="tw-label-muted">Aucun membre pour l\'instant.</div>';
    } else {
      var rows = all.map(function (u) {
        var m = ROLE_META[u.role];
        return '<div class="tw-card" style="display:flex;align-items:center;justify-content:space-between;padding:14px"><div style="font-weight:500">' + esc(u.pseudo) + '</div><span class="tw-pill" style="background:' + m.color + '1a;color:' + m.color + ";border:1px solid " + m.color + '55">' + m.emoji + " " + esc(u.role) + "</span></div>";
      }).join("");
      membersHtml = '<div style="display:grid;gap:8px;max-width:560px">' + rows + "</div>";
    }

    /* Liste automatique des membres signalés : construite à partir de tous les
       signalements existants, regroupés par utilisateur signalé. */
    var reportedMap = {};
    APP.reports.forEach(function (r) {
      var key = r.reportedUser.toLowerCase();
      if (!reportedMap[key]) {
        reportedMap[key] = { pseudo: r.reportedUser, count: 0, lastDate: 0, lastStatus: r.status, lastReason: r.reason };
      }
      reportedMap[key].count++;
      if (r.date >= reportedMap[key].lastDate) {
        reportedMap[key].lastDate = r.date;
        reportedMap[key].lastStatus = r.status;
        reportedMap[key].lastReason = r.reason;
      }
    });
    var reportedList = Object.keys(reportedMap).map(function (k) { return reportedMap[k]; });
    reportedList.sort(function (a, b) { return b.lastDate - a.lastDate; });

    var reportedHtml;
    if (!reportedList.length) {
      reportedHtml = '<div class="tw-label-muted">Aucun membre signalé.</div>';
    } else {
      var reportedRows = reportedList.map(function (m) {
        var s = STATUS[m.lastStatus];
        return '<div class="tw-card" style="display:flex;align-items:center;justify-content:space-between;padding:14px;flex-wrap:wrap;gap:10px">' +
          '<div><div style="font-weight:500">' + esc(m.pseudo) + '</div>' +
          '<div class="tw-label-muted" style="font-size:12.5px;margin-top:3px">' + m.count + (m.count > 1 ? " signalements" : " signalement") + " · dernier motif : " + esc(m.lastReason) + " · " + esc(fmtDate(m.lastDate)) + "</div></div>" +
          '<span class="tw-pill" style="background:' + s.color + '1a;color:' + s.color + ";border:1px solid " + s.color + '55">' + s.emoji + " " + esc(s.label) + "</span>" +
          "</div>";
      }).join("");
      reportedHtml = '<div style="display:grid;gap:8px;max-width:560px">' + reportedRows + "</div>";
    }

    return '<div>' +
      '<h3 style="margin:0 0 12px;font-size:15px">Membres</h3>' + membersHtml +
      '<h3 style="margin:28px 0 12px;font-size:15px">Membres signalés</h3>' + reportedHtml +
      "</div>";
  }

  function pageRoles() {
    var assignable = ROLES.filter(function (r) { return r !== "Owner"; });
    var options = assignable.map(function (r) {
      return '<option value="' + r + '"' + (r === "Member" ? " selected" : "") + ">" + ROLE_META[r].emoji + " " + r + "</option>";
    }).join("");
    var userRows = APP.users.map(function (u) {
      var m = ROLE_META[u.role];
      return '<div class="tw-card" style="display:flex;align-items:center;justify-content:space-between;padding:12px"><div>' + esc(u.pseudo) + '</div><span class="tw-pill" style="background:' + m.color + '1a;color:' + m.color + '">' + m.emoji + " " + esc(u.role) + "</span></div>";
    }).join("");
    return '<div style="max-width:560px">' +
      '<div class="tw-card" style="margin-bottom:20px">' +
      '<div style="font-weight:600;margin-bottom:12px">Attribuer un rôle</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<input id="role-pseudo" class="tw-input" style="flex:1;min-width:160px" placeholder="Pseudo du membre">' +
      '<select id="role-select" class="tw-select" style="max-width:160px">' + options + "</select>" +
      '<button class="tw-btn" data-action="role-submit">Appliquer</button>' +
      "</div>" +
      (APP.roleMsg ? '<div class="tw-label-muted" style="margin-top:10px">' + esc(APP.roleMsg) + "</div>" : "") +
      '<div class="tw-label-muted" style="margin-top:10px;line-height:1.6">' +
      "Aucune création de compte n'est nécessaire : entrez simplement le pseudo du membre. Le rôle Owner ne peut " +
      "jamais être attribué depuis cette page — il n'existe qu'un seul Owner, défini à la configuration initiale." +
      "</div></div>" +
      '<div style="display:grid;gap:8px">' + userRows + "</div>" +
      "</div>";
  }

  function pageLogs() {
    if (!APP.logs.length) return '<div class="tw-label-muted">Aucune action enregistrée pour le moment.</div>';
    var rows = APP.logs.map(function (l) {
      return '<div class="tw-card" style="padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span class="tw-mono" style="color:#a9748c;font-size:12.5px;min-width:130px">' + esc(fmtDate(l.date)) + '</span><span style="font-weight:600">' + esc(l.actor) + '</span><span style="color:#d6336c">' + esc(l.action) + '</span><span class="tw-label-muted">' + esc(l.details) + "</span></div>";
    }).join("");
    return '<div style="display:grid;gap:6px;max-width:700px">' + rows + "</div>";
  }

  function pageSettings() {
    return '<div class="tw-card" style="max-width:560px">' +
      '<div style="font-weight:600;margin-bottom:10px">Owner</div>' +
      '<div style="margin-bottom:20px">👑 ' + esc(APP.owner) + ' <span class="tw-label-muted">— protégé, non modifiable</span></div>' +
      '<div style="font-weight:600;margin-bottom:10px">À propos de la sécurité de cette instance</div>' +
      '<p class="tw-label-muted" style="line-height:1.7">' +
      "Cette version stocke ses données dans le <code>localStorage</code> de votre navigateur : elles restent sur " +
      "cet appareil et ne sont pas partagées avec les autres membres. Toutes les mutations (création de " +
      "signalement, changement de statut, attribution de rôle…) passent par un module unique qui revérifie le " +
      "rôle de l'auteur avant d'agir, afin qu'aucune action ne dépende uniquement de ce qui est affiché à l'écran. " +
      "Pour une vraie plateforme communautaire où tout le monde voit les mêmes signalements, il faut remplacer " +
      "cette couche de stockage par un vrai backend (Supabase, Firebase ou une API Node.js dédiée)." +
      "</p></div>";
  }

  function pageContent(page, role) {
    switch (page) {
      case "home": return pageHome();
      case "how": return pageHow();
      case "new-report": return pageNewReport();
      case "my-reports": return pageMyReports();
      case "dashboard": return role === "Owner" ? pageDashboard() : "";
      case "reports": return ["Owner", "Watch", "Proofs", "Staff"].indexOf(role) !== -1 ? pageReportsPanel() : "";
      case "evidence": return ["Owner", "Proofs"].indexOf(role) !== -1 ? pageEvidence() : "";
      case "members": return role === "Owner" ? pageMembers() : "";
      case "roles": return role === "Owner" ? pageRoles() : "";
      case "logs": return role === "Owner" ? pageLogs() : "";
      case "settings": return role === "Owner" ? pageSettings() : "";
      default: return "";
    }
  }

  function sidebarHtml(nav, role, session) {
    var navHtml = nav.map(function (n) {
      return '<div class="tw-navitem ' + (APP.page === n.key ? "tw-navitem-active" : "") + '" data-action="nav" data-id="' + n.key + '">' + esc(n.label) + "</div>";
    }).join("");
    var overlay = APP.navOpen ? '<div data-action="nav-close" style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30"></div>' : "";
    return overlay +
      '<aside class="tw-sidebar ' + (APP.navOpen ? "tw-sidebar-open" : "") + '">' +
      '<div style="padding:6px 8px 20px">' +
      '<div style="font-weight:700;font-size:19px;letter-spacing:.2px;font-family:\'Space Grotesk\',sans-serif;color:#fff0f6"><span style="color:#ff8ebb">Tamaya</span> Watch</div>' +
      '<div style="font-size:11.5px;color:#c98caa;letter-spacing:.3px;margin-top:2px">Signalements communautaires</div>' +
      "</div>" +
      navHtml +
      '<div style="flex:1"></div>' +
      '<div style="border-top:1px solid #55193f;padding-top:12px;margin-top:8px">' +
      '<div style="font-size:13px;font-weight:600;color:#fff0f6">' + (role ? ROLE_META[role].emoji : "") + " " + esc(session) + "</div>" +
      '<div style="font-size:12.5px;color:#c98caa;margin-bottom:10px">' + esc(role || "") + "</div>" +
      '<button style="width:100%;font-size:13px;padding:8px 10px;background:transparent;color:#fff0f6;border:1px solid #6d2650;border-radius:6px;cursor:pointer" data-action="logout">Changer de pseudo</button>' +
      "</div></aside>";
  }

  function topBarHtml(role, page) {
    return '<div style="position:sticky;top:0;z-index:5;background:rgba(253,238,244,0.85);backdrop-filter:blur(6px);border-bottom:1px solid #f1dbe7;padding:14px 24px;display:flex;align-items:center;gap:14px">' +
      '<button class="tw-only-mobile tw-btn-outline" style="padding:6px 10px" data-action="nav-open">☰</button>' +
      '<h2 style="margin:0;font-size:18px">' + esc(TITLES[page] || "") + "</h2>" +
      (role ? '<span class="tw-pill" style="margin-left:auto;background:rgba(214,51,108,0.1);color:#d6336c;border:1px solid rgba(214,51,108,0.3)">' + ROLE_META[role].emoji + " " + esc(role) + "</span>" : "") +
      "</div>";
  }

  function ownerSetupHtml() {
    return '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">' +
      '<div class="tw-card" style="max-width:440px;width:100%">' +
      '<div style="color:#d6336c;font-size:13px;font-family:\'JetBrains Mono\',monospace;margin-bottom:8px">CONFIGURATION INITIALE</div>' +
      '<h1 style="font-size:24px;margin:0 0 10px">Définir le Owner</h1>' +
      '<p style="color:#a9748c;font-size:14px;line-height:1.6;margin-bottom:18px">' +
      "Cette étape n'a lieu qu'une seule fois. Le pseudo saisi ici deviendra l'unique Owner de Tamaya Watch, avec " +
      "tous les droits. Personne d'autre ne pourra prendre ce rôle par la suite." +
      "</p>" +
      '<input id="owner-pseudo" class="tw-input" placeholder="Votre pseudo" style="margin-bottom:14px">' +
      '<button class="tw-btn" data-action="owner-claim">Devenir Owner</button>' +
      "</div></div>";
  }

  function loginScreenHtml() {
    return '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">' +
      '<div class="tw-card" style="max-width:400px;width:100%">' +
      '<div style="color:#d6336c;font-size:13px;font-family:\'JetBrains Mono\',monospace;margin-bottom:8px">TAMAYA WATCH</div>' +
      '<h1 style="font-size:22px;margin:0 0 10px">Entrez votre pseudo</h1>' +
      '<p class="tw-label-muted" style="margin-bottom:16px;line-height:1.6">' +
      "Aucun mot de passe : votre pseudo identifie votre rôle dans la communauté. Si c'est votre première visite, " +
      "vous serez ajouté en tant que Member." +
      "</p>" +
      '<input id="login-pseudo" class="tw-input" placeholder="ex : didi" style="margin-bottom:14px">' +
      '<button class="tw-btn" data-action="login-submit">Entrer</button>' +
      "</div></div>";
  }

  /* ---------------- master render ---------------- */
  function render() {
    var root = document.getElementById("root");
    if (!APP.loaded) {
      root.innerHTML = '<div class="tw-root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div class="tw-loading">INITIALISATION…</div></div></div>';
      return;
    }
    if (!APP.owner) { root.innerHTML = '<div class="tw-root">' + ownerSetupHtml() + "</div>"; return; }
    if (!APP.session) { root.innerHTML = '<div class="tw-root">' + loginScreenHtml() + "</div>"; return; }
    var role = roleOf(APP.session);
    var nav = getNav(role, APP.session);
    root.innerHTML = '<div class="tw-root"><div class="tw-shell">' +
      sidebarHtml(nav, role, APP.session) +
      '<main class="tw-main">' + topBarHtml(role, APP.page) + '<div class="tw-content">' + pageContent(APP.page, role) + "</div></main>" +
      "</div></div>";
  }

  /* ---------------- form action handlers ---------------- */
  function submitNewReport() {
    var reportedUser = (document.getElementById("nr-user").value || "").trim();
    var reason = document.getElementById("nr-reason").value;
    var description = (document.getElementById("nr-desc").value || "").trim();
    var errEl = document.getElementById("nr-err");
    if (!reportedUser || !description) { if (errEl) errEl.textContent = "Merci de remplir l'utilisateur signalé et la description."; return; }
    var res = createReport(APP.session, { reportedUser: reportedUser, reason: reason, description: description });
    if (res.ok) { APP.newReportDone = res.report; render(); } else if (errEl) { errEl.textContent = res.error; }
  }
  function addNoteFromInput(reportId, inputId) {
    var inp = document.getElementById(inputId);
    var text = (inp.value || "").trim();
    if (!text) return;
    var res = addNote(APP.session, reportId, text);
    if (res.ok) render();
  }
  function addEvidenceFromInput(reportId, inputId) {
    var inp = document.getElementById(inputId);
    var text = (inp.value || "").trim();
    if (!text) return;
    var res = addEvidence(APP.session, reportId, text);
    if (res.ok) render();
  }
  function assignFromSelect(reportId, selectId) {
    var sel = document.getElementById(selectId);
    var val = sel.value;
    if (!val) return;
    assignStaff(APP.session, reportId, val);
    render();
  }
  function submitRole() {
    var pseudo = (document.getElementById("role-pseudo").value || "").trim();
    var role = document.getElementById("role-select").value;
    if (!pseudo) return;
    var res = setRole(APP.session, pseudo, role);
    APP.roleMsg = res.ok ? ("Rôle mis à jour pour " + pseudo + ".") : res.error;
    render();
  }

  /* ---------------- event delegation ---------------- */
  function onRootClick(e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");
    switch (action) {
      case "nav": case "goto": setPage(id); break;
      case "nav-open": APP.navOpen = true; render(); break;
      case "nav-close": APP.navOpen = false; render(); break;
      case "logout": logout(); break;
      case "login-submit": login(document.getElementById("login-pseudo").value); break;
      case "owner-claim": claimOwnerAndLogin(document.getElementById("owner-pseudo").value); break;
      case "new-report-submit": submitNewReport(); break;
      case "my-report-note": addNoteFromInput(id, "note-my-" + id); break;
      case "report-note": addNoteFromInput(id, "note-rp-" + id); break;
      case "report-evidence": addEvidenceFromInput(id, "ev-" + id); break;
      case "report-assign": assignFromSelect(id, "assign-" + id); break;
      case "report-status": setStatus(APP.session, id, el.getAttribute("data-status")); render(); break;
      case "filter": APP.reportsFilter = id; render(); break;
      case "role-submit": submitRole(); break;
    }
  }
  function onRootKeydown(e) {
    if (e.key === "Enter" && e.target && e.target.id === "login-pseudo") login(e.target.value);
    if (e.key === "Enter" && e.target && e.target.id === "owner-pseudo") claimOwnerAndLogin(e.target.value);
  }

  function init() {
    var root = document.getElementById("root");
    root.addEventListener("click", onRootClick);
    root.addEventListener("keydown", onRootKeydown);
    APP.owner = "94c65";
    storeSet(K_OWNER, "94c65");
    APP.users = storeGet(K_USERS) || [];
    APP.reports = storeGet(K_REPORTS) || [];
    APP.logs = storeGet(K_LOGS) || [];
    var sess = storeGet(K_SESSION);
    if (sess && sess.pseudo) APP.session = sess.pseudo;
    APP.loaded = true;
    render();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
